<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DDS Expo Admin</title><link rel="stylesheet" href="css/style.css"></head>
<body class="adminPage"><main class="admin"><h1>DDS Expo Admin Panel</h1><p>Login and publish news.</p>
<div id="loginBox"><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password">
<button id="loginBtn" class="btn">LOGIN</button><p id="loginMsg"></p></div>
<div id="panel" hidden><button id="logoutBtn">Logout</button><hr>
<input id="title" placeholder="News title"><input id="category" placeholder="Category" value="Updates">
<textarea id="content" placeholder="News content"></textarea><input id="image" type="file" accept="image/*">
<button id="publishBtn" class="btn">PUBLISH NEWS</button><p id="msg"></p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/admin.js"></script>
</body></html>
