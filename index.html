<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DDS EXPO Work Approval Portal</title>
<style>
body{margin:0;background:#07111f;color:#eef6ff;font-family:system-ui,Arial}.top{padding:15px 20px;background:#091827;display:flex;justify-content:space-between;gap:12px;align-items:center;position:sticky;top:0;z-index:5;border-bottom:1px solid #1d3653}.brand{font-weight:900}.brand small{display:block;color:#62a9ff;font-size:9px;letter-spacing:2px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button,.ghost{background:#10243b;color:#fff;border:1px solid #1d3653;padding:9px 12px;border-radius:9px}.active,.primary{background:#2f8cff!important;color:white;border:0!important}.wrap{max-width:1100px;margin:auto;padding:25px 16px}.hero h1{font-size:clamp(26px,5vw,42px);margin:0 0 6px}.muted{color:#9db0c7}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.stat{background:#0d1b2d;border:1px solid #1d3653;border-radius:15px;padding:17px;margin-top:15px}.stat b{font-size:28px;display:block}.stat span{font-size:12px;color:#9db0c7}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}label{display:block;font-size:13px;color:#bdd0e4;margin-bottom:6px}input,textarea,select{width:100%;box-sizing:border-box;background:#071321;color:white;border:1px solid #1d3653;border-radius:9px;padding:11px}textarea{min-height:95px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.primary,.success,.warn,.danger{padding:11px 15px;border-radius:9px;font-weight:800}.success{background:#22c55e;color:#06150a;border:0}.warn{background:#f59e0b;color:#211400;border:0}.danger{background:#ef4444;color:white;border:0}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#16304b;font-size:11px}.approved{background:#0c3b25;color:#6ef2a0}.mod{background:#493509;color:#ffd477}.rejected{background:#48151a;color:#ff929b}.preview{width:100%;max-height:600px;object-fit:contain;background:#02060b;border-radius:12px;margin-top:10px}.pdf{width:100%;height:600px;border:1px solid #1d3653;border-radius:12px}.decision{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.decision button{padding:15px;border-radius:11px;font-weight:900}.share{display:flex;gap:7px}.share input{flex:1}.responseBox{margin-top:12px;padding:12px;border:1px solid #6b531d;background:#1a160a;border-radius:10px}.responseBox b{display:block;margin-bottom:6px;color:#ffd477}.responseBox div{white-space:pre-wrap;line-height:1.5}.responseBox small{display:block;margin-top:7px}.empty{text-align:center;padding:30px;color:#9db0c7}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.decision{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}}@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header class="top"><div class="brand">DDS EXPO<small>AI DIGITAL MARKETING AGENCY</small></div><nav class="nav"><button id="bDash" onclick="go('dashboard')">Dashboard</button><button id="bCreate" onclick="go('create')">Create Work</button><button id="bWorks" onclick="go('works')">All Works</button></nav></header>
<main class="wrap" id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://mbjfzwtfyymqnursjhwh.supabase.co";
const SUPABASE_KEY="sb_publishable_BZ55Y-ojn98CfaZ1QLWw2A_ZcJiQrlz";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const BUCKET="dds-works";let view="dashboard";
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function status(s){let c=s==="APPROVED"?"approved":s==="MODIFICATION REQUESTED"?"mod":s==="REJECTED"?"rejected":"";return '<span class="pill '+c+'">'+esc(s||"PENDING")+"</span>"}
function link(t){return location.origin+location.pathname+"#work/"+t}
function go(v){view=v;location.hash="";render()}
function openClient(t){location.hash="work/"+t}
function media(w){if((w.file_type||"").startsWith("image/"))return '<img class="preview" src="'+esc(w.file_url)+'">';if((w.file_type||"").startsWith("video/"))return '<video class="preview" controls src="'+esc(w.file_url)+'"></video>';if(w.file_type==="application/pdf")return '<iframe class="pdf" src="'+esc(w.file_url)+'"></iframe>';return '<a class="primary" href="'+esc(w.file_url)+'" target="_blank">OPEN FILE</a>'}
async function works(){let r=await sb.from("works").select("*").order("created_at",{ascending:false});if(r.error)throw r.error;return r.data||[]}
function row(w){let response=(w.last_response||"").trim();let responseBox=response?'<div class="responseBox"><b>'+((w.status==="MODIFICATION REQUESTED")?"Client Modification Request":(w.status==="REJECTED"?"Client Reject Reason":"Client Response"))+'</b><div>'+esc(response)+'</div>'+(w.last_response_at?'<small class="muted">'+esc(new Date(w.last_response_at).toLocaleString())+'</small>':'')+'</div>':'';return '<div class="card"><b>'+esc(w.title)+'</b><div class="muted">'+esc(w.client_name)+' • '+esc(w.category||"")+'</div><div style="margin-top:7px">'+status(w.status)+'</div>'+responseBox+'<div class="actions"><button class="ghost" onclick="openClient(\''+w.token+'\')">Client Review</button><button class="ghost" onclick="navigator.clipboard.writeText(link(\''+w.token+'\')).then(()=>alert(\'Client link copied\'))">Copy Client Link</button></div></div>'}
async function dashboard(){app.innerHTML='<div class="hero"><h1>DDS EXPO Work Approval Portal</h1><p class="muted">LET’S BUILD THE BRIDGE TO YOUR SUCCESS</p></div><div id="dash"></div>';try{let a=await works(),n={t:a.length,p:0,a:0,m:0,r:0};a.forEach(x=>x.status==="APPROVED"?n.a++:x.status==="MODIFICATION REQUESTED"?n.m++:x.status==="REJECTED"?n.r++:n.p++);dash.innerHTML='<div class="grid"><div class="stat"><b>'+n.t+'</b><span>TOTAL WORKS</span></div><div class="stat"><b>'+n.p+'</b><span>PENDING</span></div><div class="stat"><b>'+n.a+'</b><span>APPROVED</span></div><div class="stat"><b>'+n.m+'</b><span>MODIFICATION REQUESTED</span></div></div><div class="card"><h2>Recent Works</h2>'+(a.slice(0,12).map(row).join("")||'<div class="empty">No works yet.</div>')+'</div>'}catch(e){dash.innerHTML='<div class="card"><b>Database setup is not completed.</b><p class="muted">'+esc(e.message)+'</p><p class="muted">Run the supplied SUPABASE_SETUP.sql once in Supabase SQL Editor.</p></div>'}}
function create(){app.innerHTML='<div class="hero"><h1>Create New Work</h1><p class="muted">Upload once — your client can open the same work from another phone.</p></div><div class="card"><div class="formgrid"><div><label>Work Title *</label><input id="title"></div><div><label>Client Name *</label><input id="client"></div><div><label>Client Email</label><input id="email"></div><div><label>Client Phone</label><input id="phone"></div><div><label>Category</label><select id="cat"><option>Social Media Poster</option><option>Video</option><option>Reel</option><option>Logo</option><option>Website</option><option>Banner</option><option>Advertisement</option><option>Brochure</option><option>Digital Marketing</option><option>Other</option></select></div><div><label>Deadline</label><input id="deadline" type="date"></div><div class="full"><label>Description</label><textarea id="desc"></textarea></div><div class="full"><label>Upload Work *</label><input id="file" type="file" accept="image/*,video/*,application/pdf"></div><div class="full"><label>Notes</label><textarea id="notes"></textarea></div></div><div class="actions"><button class="primary" onclick="uploadWork()">UPLOAD & CREATE CLIENT LINK</button></div><div id="out"></div></div>'}
async function uploadWork(){let f=$("file").files[0],t=$("title").value.trim(),c=$("client").value.trim();if(!f||!t||!c){$("out").innerHTML='<p class="muted">Title, Client Name and file are required.</p>';return}if(f.size>200*1024*1024){$("out").innerHTML='<p class="muted">Maximum file size is 200 MB.</p>';return}$("out").innerHTML='<p class="muted">Uploading…</p>';try{let id=crypto.randomUUID(),path=id+"/"+f.name.replace(/[^a-zA-Z0-9._-]/g,"_"),u=await sb.storage.from(BUCKET).upload(path,f,{upsert:false,contentType:f.type});if(u.error)throw u.error;let pub=sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl,token=crypto.randomUUID().replaceAll("-","").slice(0,20),r=await sb.from("works").insert({title:t,client_name:c,client_email:$("email").value.trim(),client_phone:$("phone").value.trim(),category:$("cat").value,deadline:$("deadline").value||null,description:$("desc").value.trim(),notes:$("notes").value.trim(),file_name:f.name,file_type:f.type,file_path:path,file_url:pub,token,status:"PENDING"});if(r.error)throw r.error;let l=link(token);$("out").innerHTML='<div class="card"><b>Work saved successfully.</b><p class="muted">Send this client link:</p><div class="share"><input id="newlink" value="'+esc(l)+'" readonly><button class="success" onclick="navigator.clipboard.writeText(newlink.value)">COPY</button></div><div class="actions"><button class="primary" onclick="openClient(\''+token+'\')">OPEN CLIENT REVIEW</button></div></div>'}catch(e){$("out").innerHTML='<p class="muted">Upload failed: '+esc(e.message)+'</p>'}}
async function allWorks(){app.innerHTML='<div class="hero"><h1>All Works</h1><p class="muted">Cloud-saved works and live status.</p></div><div id="list"></div>';try{let a=await works();list.innerHTML=a.map(row).join("")||'<div class="card empty">No works yet.</div>'}catch(e){list.innerHTML='<div class="card">'+esc(e.message)+'</div>'}}
function responseForm(id,s){$("box").innerHTML='<div class="section"><label>'+(s==="REJECTED"?"Reject Reason":"Modification Request")+'</label><textarea id="comment"></textarea><button class="'+(s==="REJECTED"?"danger":"warn")+'" style="margin-top:8px" onclick="respond(\''+id+'\',\''+s+'\')">SUBMIT</button></div>'}
async function respond(id,s){let comment=$("comment")?$("comment").value.trim():"";try{let r=await sb.from("works").update({status:s,last_response:comment,last_response_at:new Date().toISOString()}).eq("id",id);if(r.error)throw r.error;let h=await sb.from("work_history").insert({work_id:id,status:s,comment});if(h.error)throw h.error;alert(s==="APPROVED"?"Work approved successfully.":"Response submitted successfully.");location.hash="";go("dashboard")}catch(e){alert("Could not save response: "+e.message)}}
async function review(token){app.innerHTML='<div class="card">Loading work…</div>';try{let r=await sb.from("works").select("*").eq("token",token).maybeSingle();if(r.error)throw r.error;if(!r.data){app.innerHTML='<div class="card"><h2>Work not found</h2><p class="muted">Invalid client link.</p></div>';return}let w=r.data;app.innerHTML='<div class="hero"><h1>'+esc(w.title)+'</h1><p class="muted">'+esc(w.client_name)+' • '+esc(w.category||"")+' • '+status(w.status)+'</p></div><div class="card">'+media(w)+'<div class="section"><h3>Work Details</h3><p>'+esc(w.description||"No description provided.")+'</p>'+(w.notes?'<p class="muted"><b>Notes:</b> '+esc(w.notes)+'</p>':"")+(w.deadline?'<p class="muted"><b>Deadline:</b> '+esc(w.deadline)+'</p>':"")+'</div><div class="decision"><button class="success" onclick="respond(\''+w.id+'\',\'APPROVED\')">✓ APPROVAL</button><button class="warn" onclick="responseForm(\''+w.id+'\',\'MODIFICATION REQUESTED\')">✎ MODIFICATION</button><button class="danger" onclick="responseForm(\''+w.id+'\',\'REJECTED\')">✕ REJECT</button></div><div id="box"></div></div>'}catch(e){app.innerHTML='<div class="card"><h2>Could not load work</h2><p class="muted">'+esc(e.message)+'</p></div>'}}
function render(){document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));if(location.hash.startsWith("#work/"))return review(location.hash.split("/")[1]);if(view==="dashboard"){$("bDash").classList.add("active");dashboard()}else if(view==="create"){$("bCreate").classList.add("active");create()}else{$("bWorks").classList.add("active");allWorks()}}
window.addEventListener("hashchange",render);render();
</script></body></html>
